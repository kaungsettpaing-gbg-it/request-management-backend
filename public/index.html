<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Request System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #111827;
            --bg-input: #1f2937;
            --accent-primary: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #374151;
            --radius: 12px;
        }
        * { box-sizing: border-box; transition: all 0.2s ease; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .main-container {
            width: 100%;
            max-width: 850px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }
        .app-header {
            padding: 24px 30px;
            border-bottom: 1px solid var(--border-color);
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .content-area { padding: 35px; }
        .auth-tabs {
            display: flex;
            background: var(--bg-input);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 30px;
        }
        .auth-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
        }
        .auth-tab.active {
            background: var(--bg-card);
            color: var(--text-main);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
        }
        .form-card h3 { margin-top: 0; margin-bottom: 20px; font-size: 20px; }
        form { display: flex; flex-direction: column; gap: 16px; }
        label { font-size: 13px; font-weight: 500; color: var(--text-muted); }
        input, select, textarea {
            padding: 12px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
        }
        input:focus { outline: none; border-color: var(--accent-primary); }
        .btn-main {
            padding: 12px;
            background: var(--accent-primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-main:hover { background: var(--accent-hover); }
        .hidden { display: none !important; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        th { color: var(--text-muted); font-size: 12px; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="app-header">
        🏢 Enterprise Request System (Security & Compliance Edition)
    </div>

    <div class="content-area">
        <!-- Auth Box -->
        <div id="authSection">
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchAuthTab('login')">Login</button>
                <button class="auth-tab" onclick="switchAuthTab('register')">Register</button>
            </div>

            <!-- Login Form -->
            <div id="loginFormContainer" class="form-card">
                <h3>Secure Account Login</h3>
                <form id="loginForm">
                    <label>Email or Username:</label>
                    <input type="text" id="loginKey" placeholder="Enter username or email" required>
                    <label>Password:</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                    <button type="submit" class="btn-main">Sign In</button>
                </form>
            </div>

            <!-- Register Form -->
            <div id="registerFormContainer" class="form-card hidden">
                <h3>Create New Account</h3>
                <form id="registerForm">
                    <label>Full Name:</label>
                    <input type="text" id="regName" placeholder="Full Name" required>
                    <label>Username / Telegram ID:</label>
                    <input type="text" id="regTelegram" placeholder="username" required>
                    <label>Password:</label>
                    <input type="password" id="regPassword" placeholder="••••••••" required>
                    <label>Department:</label>
                    <select id="regDept">
                        <option value="IT">IT</option>
                        <option value="Admin">Admin</option>
                        <option value="HR">HR</option>
                        <option value="Finance">Finance</option>
                    </select>
                    <label>Role:</label>
                    <select id="regRole">
                        <option value="STAFF">Staff</option>
                        <option value="MANAGER">Manager</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                    <button type="submit" class="btn-main">Register</button>
                </form>
            </div>
        </div>

        <!-- Dashboard (Hidden initially) -->
        <div id="dashboardSection" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 id="welcomeUser" style="margin:0;">Dashboard</h3>
                <button onclick="location.reload()" style="background:#ef4444; color:white; border:none; padding:8px 14px; border-radius:6px; cursor:pointer;">Logout</button>
            </div>
            <div id="requestHistoryContainer">
                <h4>Recent Requests</h4>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="reqTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    function switchAuthTab(tab) {
        const loginContainer = document.getElementById('loginFormContainer');
        const regContainer = document.getElementById('registerFormContainer');
        const tabs = document.querySelectorAll('.auth-tab');

        tabs.forEach(t => t.classList.remove('active'));

        if (tab === 'login') {
            loginContainer.classList.remove('hidden');
            regContainer.classList.add('hidden');
            tabs[0].classList.add('active');
        } else {
            loginContainer.classList.add('hidden');
            regContainer.classList.remove('hidden');
            tabs[1].classList.add('active');
        }
    }

    // Safe Login Handler (Fixed .replace undefined error)
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const inputVal = document.getElementById('loginKey')?.value || '';
        const loginKey = inputVal ? inputVal.replace('@', '').trim() : '';
        const password = document.getElementById('loginPassword')?.value || '';

        if (!loginKey || !password) {
            alert('Please fill in all fields');
            return;
        }

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ loginKey, password })
            });
            const data = await res.json();

            if (res.ok) {
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                document.getElementById('welcomeUser').innerText = `Welcome, ${data.user.name} (${data.user.role})`;
            } else {
                alert(data.error || 'Login failed');
            }
        } catch (err) {
            alert('Connection error');
        }
    });

    // Register Handler
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            name: document.getElementById('regName').value,
            telegramUsername: document.getElementById('regTelegram').value,
            password: document.getElementById('regPassword').value,
            department: document.getElementById('regDept').value,
            role: document.getElementById('regRole').value
        };

        const res = await fetch('/api/users', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            alert('Registration successful! Please login.');
            switchAuthTab('login');
        } else {
            const err = await res.json();
            alert(err.error || 'Registration failed');
        }
    });
</script>
</body>
</html>
